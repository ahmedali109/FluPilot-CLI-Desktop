<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data:;"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles/flutter_explorer.css" />
    <link rel="stylesheet" href="styles/output.css" />
    <title>Code Preview</title>
  </head>
  <body class="flex flex-col h-screen overflow-hidden text-white bg-dark-bg">
    <style>
      :root {
        --bg-quaternary: #3f4451;
        --text-secondary: #abb2bf;
      }
      /* Responsive breakpoints */
      @media (max-width: 800px) {
        .responsive-hide{
          display: none !important;
        }
      }
    </style>
    <!-- Hamburger Menu Panel -->
    <div
      id="menu-panel"
      class="fixed top-0 left-0 z-50 h-full overflow-y-auto transition-transform duration-300 ease-in-out transform -translate-x-full border-r border-gray-700 bg-dark-surface"
      style="width: min(90vw, 380px)"
    >
      <!-- Menu Header -->
      <div
        class="flex items-center justify-between p-3 border-b border-gray-700"
      >
        <h2 class="text-lg font-bold text-white mt-6">UI Kit Library</h2>
        <button
          onclick="toggleMenu()"
          class="p-2 text-gray-400 rounded cursor-pointer hover:text-white hover:bg-gray-700"
          title="Close Menu"
        >
          ✕
        </button>
      </div>
      <!-- Search Input -->
      <div class="p-3">
        <input
          type="text"
          id="menu-search"
          placeholder="Search components..."
          class="w-full p-2 text-white bg-transparent border border-gray-600 rounded focus:outline-none focus:border-gray-400"
        />
      </div>

      <!-- Projects List -->
      <div id="projects-list" class="p-3">
        <!-- Projects will be rendered here -->
      </div>
    </div>

    <!-- Tab Bar -->
    <div
      class="border-b border-gray-700 bg-dark-surface"
      style="-webkit-app-region: drag"
    >
      <div class="flex items-center justify-between pl-32 pr-20 py-2">
        <!-- Left Section: Hamburger Menu and Project Info -->
        <div
          class="flex items-center flex-shrink-0 min-w-0"
          style="-webkit-app-region: no-drag"
        >
          <!-- Hamburger Menu Button -->
          <button
            onclick="toggleMenu()"
            class="p-1.5 mr-2 text-gray-400 transition-colors rounded cursor-pointer hover:text-white hover:bg-gray-700 flex-shrink-0"
            title="Open Projects Menu"
            style="-webkit-app-region: no-drag"
          >
            <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 20 20">
              <path
                fill-rule="evenodd"
                d="M3 5a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zM3 10a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zM3 15a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1z"
                clip-rule="evenodd"
              ></path>
            </svg>
          </button>

          <!-- Project Header -->
          <div class="flex items-center min-w-0">
            <span class="flex-shrink-0 mr-2">
              <img
                id="project-logo"
                src="assets/flutter-original.svg"
                alt="Project Logo"
                class="inline-block w-5 h-5 align-middle"
              />
            </span>
            <span
              id="project-title"
              class="text-sm font-semibold text-white truncate"
              >Flutter Project</span
            >
          </div>
        </div>

        <!-- Center Section: Navigation Buttons -->
        <div
          class="flex flex-shrink-0 gap-1 mx-2"
          style="-webkit-app-region: no-drag"
        >
          <button
            id="terminal-nav"
            class="bg-[var(--bg-quaternary)] border-none text-[var(--text-secondary)] px-2 py-1 rounded cursor-pointer text-xs font-inherit transition-all duration-200 ease-[ease]"
            style="-webkit-app-region: no-drag"
          >
            Terminal
          </button>
          <button
            id="flutterCode-nav"
            class="bg-[var(--bg-quaternary)] border-none text-[var(--text-secondary)] px-2 py-1 rounded cursor-pointer text-xs font-inherit transition-all duration-200 ease-[ease]"
            style="-webkit-app-region: no-drag"
          >
            UI Kit
          </button>
        </div>

        <!-- Right Section: Controls -->
        <div
          class="flex items-center flex-shrink-0 min-w-0 space-x-1"
          style="-webkit-app-region: no-drag"
        >
          <span class="text-xs text-gray-400 responsive-hide"
            >Night Owl</span
          >
          <button
            class="flex items-center px-2 py-1 text-xs bg-gray-700 rounded hover:bg-gray-600 whitespace-nowrap"
            onclick="copyCode(event)"
            title="Copy Code"
            style="-webkit-app-region: no-drag"
          >
            📋
            <span class="ml-1 responsive-hide">Copy</span>
          </button>
          <button
            class="flex items-center px-2 py-1 text-xs bg-gray-700 rounded hover:bg-gray-600 whitespace-nowrap"
            onclick="AddCodeToWorkSpaceIDE(event)"
            title="Add to WorkSpace"
            style="-webkit-app-region: no-drag"
          >
            💼
            <span class="ml-1 responsive-hide">Add To WorkSpace</span>
          </button>
        </div>
      </div>
    </div>

    <!-- Main Content Area -->
    <div class="flex flex-1 min-h-0">
      <!-- Left Sidebar -->
      <div
        class="flex flex-col border-r border-gray-700 bg-dark-surface responsive-hide"
      >
        <!-- Sidebar Header -->
        <div class="flex-shrink-0 p-3 border-b border-gray-700">
          <h2 class="text-sm font-semibold text-white">Explorer</h2>
        </div>

        <!-- Sidebar Content -->
        <div class="flex-1 overflow-y-auto">
          <!-- Project Structure -->
          <div class="p-2">
            <div class="mb-2">
              <div
                class="flex items-center text-xs font-medium tracking-wider text-gray-400 uppercase"
              >
                <span class="truncate project-name">Flutter Project</span>
              </div>
            </div>

            <!-- File Tree -->
            <div id="project-files" class="space-y-1">
              <!-- Files will be rendered dynamically -->
              <div class="flex items-center p-1 text-sm text-gray-400">
                <span class="mr-2">📄</span>
                <span>Loading files...</span>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- Code Editor Panel -->
      <div class="flex-1 min-w-0 overflow-hidden bg-code-bg">
        <div class="h-full overflow-auto">
          <!-- Flutter Code -->
          <div id="flutter-code" class="h-full code-content">
            <div class="min-h-full p-4 text-sm code-editor line-numbers">
              <!-- Code will be loaded dynamically from JSON -->
            </div>
          </div>
        </div>
      </div>

      <!-- iPhone Preview Panel -->
      <div
        class="flex-shrink-0 bg-gray-800 responsive-hide"
        style="width: clamp(250px, 25vw, 400px)"
      >
        <div class="flex items-center justify-center h-full p-4">
          <!-- iPhone Frame -->
          <img
            id="preview-image"
            src="./assets/records-selection.png"
            alt="App Preview"
            class="object-contain w-full h-auto max-w-full max-h-full rounded-lg shadow-lg"
          />
        </div>
      </div>
    </div>
    <script src="./models.js"></script>
    <script src="./ui-manager.js"></script>
    <script src="./application-menu-ipc-handler.js"></script>
    <script type="module" src="./shared_logic.js"></script>
  </body>
</html>
